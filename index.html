<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>男廁標誌辨識小遊戲</title>
    <!-- Tailwind CSS for high-contrast responsive layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Modern high contrast theme for maximum accessibility */
        body {
            background-color: #0f172a; /* Slate 900 */
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* Option cards interactive feedback */
        .option-card {
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }

        .option-card:hover {
            transform: translateY(-4px);
        }

        .option-card:active {
            transform: scale(0.97);
        }

        /* Pulse highlight for active question box */
        @keyframes pulse-border {
            0%, 100% { border-color: #facc15; }
            50% { border-color: #ffffff; }
        }

        .animate-speak {
            animation: pulse-border 1.2s infinite;
        }

        /* Short bounce for correct modal */
        @keyframes bounce-short {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .animate-bounce-short {
            animation: bounce-short 0.4s ease-in-out 2;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 md:p-6">

    <div id="app" class="max-w-6xl mx-auto w-full flex-1 flex flex-col justify-between items-center">

        <!-- Header Bar -->
        <header class="w-full flex justify-between items-center bg-slate-800 border-4 border-yellow-400 rounded-2xl p-3 md:p-4 mb-3 shadow-xl">
            <h1 class="text-xl md:text-3xl font-extrabold text-yellow-300 tracking-wide flex items-center gap-2">
                <span class="text-2xl md:text-4xl">🚹</span> 男廁標誌辨識遊戲
            </h1>

            <div id="game-progress" class="hidden flex items-center gap-3">
                <div class="text-lg md:text-2xl font-bold text-white bg-slate-900 px-3 py-1.5 rounded-xl border-2 border-slate-600">
                    題號: <span id="current-round-text" class="text-yellow-400">1</span> / 3
                </div>
                <button id="btn-replay" onclick="game.replayQuestion()" class="flex items-center gap-2 bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 font-black text-base md:text-xl px-4 py-2 rounded-xl shadow-lg border-2 border-yellow-200 transition">
                    <span>🔊</span> 重聽問題
                </button>
            </div>
        </header>

        <!-- SCREEN 1: START SCREEN -->
        <main id="screen-start" class="w-full flex-1 flex flex-col items-center justify-center text-center my-auto p-6 bg-slate-800/90 rounded-3xl border-4 border-slate-700 shadow-2xl max-w-4xl">
            
            <!-- Red Female & Blue Male Sign Preview on Cover -->
            <div class="flex items-center justify-center gap-6 md:gap-12 mb-6">
                <!-- Red Female Toilet Sign Preview -->
                <div class="w-32 h-32 md:w-48 md:h-48 bg-white border-4 md:border-8 border-red-600 rounded-3xl p-2 md:p-4 flex flex-col items-center justify-between shadow-lg">
                    <svg viewBox="0 0 200 220" class="w-full h-full">
                        <circle cx="100" cy="35" r="22" fill="#dc2626"/>
                        <path d="M 75 70 C 75 65, 125 65, 125 70 L 140 135 L 60 135 Z" fill="#dc2626"/>
                        <rect x="80" y="130" width="15" height="40" rx="7" fill="#dc2626"/>
                        <rect x="105" y="130" width="15" height="40" rx="7" fill="#dc2626"/>
                        <path d="M 72 70 L 50 115 C 47 121, 38 116, 42 110 L 62 68 Z" fill="#dc2626"/>
                        <path d="M 128 70 L 150 115 C 153 121, 162 116, 158 110 L 138 68 Z" fill="#dc2626"/>
                        <text x="100" y="200" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="28" fill="#dc2626" text-anchor="middle">WOMEN</text>
                    </svg>
                </div>

                <!-- Blue Male Toilet Sign Preview -->
                <div class="w-32 h-32 md:w-48 md:h-48 bg-white border-4 md:border-8 border-blue-700 rounded-3xl p-2 md:p-4 flex flex-col items-center justify-between shadow-lg">
                    <svg viewBox="0 0 200 220" class="w-full h-full">
                        <circle cx="100" cy="35" r="22" fill="#1d4ed8"/>
                        <rect x="75" y="65" width="50" height="65" rx="8" fill="#1d4ed8"/>
                        <rect x="80" y="125" width="16" height="45" rx="8" fill="#1d4ed8"/>
                        <rect x="104" y="125" width="16" height="45" rx="8" fill="#1d4ed8"/>
                        <path d="M 72 68 L 50 115 C 46 121, 38 116, 42 110 L 62 66 Z" fill="#1d4ed8"/>
                        <path d="M 128 68 L 150 115 C 154 121, 162 116, 158 110 L 138 66 Z" fill="#1d4ed8"/>
                        <text x="100" y="200" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="28" fill="#1d4ed8" text-anchor="middle">MEN</text>
                    </svg>
                </div>
            </div>

            <h2 class="text-2xl md:text-4xl font-black text-yellow-300 mb-4 leading-relaxed">
                男廁標誌辨識挑戰
            </h2>
            <p class="text-lg md:text-xl text-slate-200 mb-8 max-w-xl leading-normal">
                專為 iPad 及桌面電腦設計！仔細聽語音問題，找出正確的<strong class="text-blue-400">「男廁標誌」</strong>。共 3 題挑戰！
            </p>
            <button onclick="game.start()" class="w-full max-w-md bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 text-slate-950 text-2xl md:text-4xl font-black py-5 px-8 rounded-3xl border-4 border-emerald-200 shadow-2xl transform active:scale-95 transition-all">
                ▶ 開始遊戲
            </button>
        </main>

        <!-- SCREEN 2: GAMEPLAY SCREEN (2 COLUMNS) -->
        <main id="screen-game" class="hidden w-full flex-1 flex flex-col justify-between my-auto gap-4">
            
            <!-- Compact Question Prompt Box (Font size scaled down to maximize card display) -->
            <div id="question-box" class="w-full bg-blue-950 border-4 border-cyan-400 rounded-2xl p-3 md:p-4 text-center shadow-xl animate-speak">
                <span class="text-slate-300 text-sm md:text-base font-semibold block mb-0.5">請聽語音選擇正確標誌：</span>
                <h2 id="question-text" class="text-xl md:text-3xl font-black text-yellow-300 tracking-wider">
                    哪一個是「男廁標誌」？
                </h2>
            </div>

            <!-- Left and Right 2-Column Choice Grid (No left/right text labels) -->
            <div class="grid grid-cols-2 gap-4 md:gap-8 w-full flex-1 min-h-[420px] md:min-h-[520px]">
                
                <!-- Left Option Card -->
                <button id="card-left" onclick="game.selectAnswer('left')" class="option-card bg-slate-800 border-8 border-yellow-400 hover:border-white rounded-3xl p-4 md:p-8 flex flex-col items-center justify-center cursor-pointer shadow-2xl relative group">
                    <div class="w-full h-full flex items-center justify-center bg-white rounded-2xl p-4 md:p-6 shadow-inner">
                        <img id="img-left" src="maletoilet.jpg" alt="廁所標誌選項" class="max-h-[320px] md:max-h-[420px] w-auto max-w-full object-contain mx-auto">
                    </div>
                </button>

                <!-- Right Option Card -->
                <button id="card-right" onclick="game.selectAnswer('right')" class="option-card bg-slate-800 border-8 border-yellow-400 hover:border-white rounded-3xl p-4 md:p-8 flex flex-col items-center justify-center cursor-pointer shadow-2xl relative group">
                    <div class="w-full h-full flex items-center justify-center bg-white rounded-2xl p-4 md:p-6 shadow-inner">
                        <img id="img-right" src="femaletoilet.jpg" alt="廁所標誌選項" class="max-h-[320px] md:max-h-[420px] w-auto max-w-full object-contain mx-auto">
                    </div>
                </button>

            </div>
        </main>

        <!-- SCREEN 3: RESULTS SCREEN -->
        <main id="screen-result" class="hidden w-full flex-1 flex flex-col items-center justify-center text-center my-auto p-6 bg-slate-800 border-4 border-yellow-400 rounded-3xl shadow-2xl max-w-2xl">
            <div id="result-icon" class="text-6xl md:text-8xl mb-3">🏆</div>
            <h2 class="text-2xl md:text-4xl font-black text-yellow-300 mb-3">
                遊戲完成！
            </h2>
            <div class="bg-slate-900 border-2 border-slate-700 rounded-2xl p-5 mb-6 w-full">
                <p class="text-xl md:text-3xl font-bold text-white mb-2">
                    你的得分：<span id="final-score" class="text-4xl md:text-6xl text-yellow-400 font-black">3</span> / 3
                </p>
                <p id="result-comment" class="text-xl md:text-2xl text-emerald-400 font-bold mt-2">
                    太厲害了！完全答對！
                </p>
            </div>
            <button onclick="game.start()" class="w-full max-w-md bg-yellow-400 hover:bg-yellow-300 active:bg-yellow-500 text-slate-950 text-2xl md:text-4xl font-black py-5 px-8 rounded-3xl border-4 border-yellow-200 shadow-2xl transform active:scale-95 transition-all">
                🔄 再玩一次
            </button>
        </main>

        <!-- Audio & Visual Feedback Overlay -->
        <div id="feedback-modal" class="fixed inset-0 bg-slate-950/85 flex items-center justify-center p-6 hidden z-50 transition-all duration-300">
            <div id="feedback-content" class="bg-slate-900 border-8 border-emerald-400 rounded-3xl p-8 md:p-12 text-center max-w-xl w-full shadow-2xl flex flex-col items-center">
                <div id="feedback-icon" class="text-7xl md:text-9xl mb-4">✅</div>
                <h2 id="feedback-text" class="text-3xl md:text-5xl font-black text-emerald-400 leading-tight">
                    你答對了!做得好!
                </h2>
            </div>
        </div>

    </div>

    <script>
        /* Exact SVG Fallbacks replicating femaletoilet.jpg & maletoilet.jpg precisely */
        const SVG_FEMALE = "data:image/svg+xml;utf8," + encodeURIComponent(`
            <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 320' width='100%' height='100%'>
                <!-- Red rounded outer frame matching femaletoilet.jpg -->
                <rect x='12' y='12' width='296' height='296' rx='42' fill='#ffffff' stroke='#dc2626' stroke-width='20'/>
                
                <!-- Red Female Figure: Head, Body/Skirt, Arms, Legs -->
                <circle cx='160' cy='62' r='24' fill='#dc2626'/>
                <path d='M 124 108 C 124 100, 196 100, 196 108 L 216 182 L 104 182 Z' fill='#dc2626'/>
                <rect x='132' y='180' width='22' height='52' rx='10' fill='#dc2626'/>
                <rect x='166' y='180' width='22' height='52' rx='10' fill='#dc2626'/>
                <path d='M 124 108 L 96 168 C 92 175, 80 170, 84 162 L 112 104 Z' fill='#dc2626'/>
                <path d='M 196 108 L 224 168 C 228 175, 240 170, 236 162 L 208 104 Z' fill='#dc2626'/>
                
                <!-- Red text: WOMEN -->
                <text x='160' y='278' font-family="'Arial Black', Arial, sans-serif" font-weight='900' font-size='42' fill='#dc2626' text-anchor='middle' letter-spacing='1.5'>WOMEN</text>
            </svg>
        `);

        const SVG_MALE = "data:image/svg+xml;utf8," + encodeURIComponent(`
            <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 320' width='100%' height='100%'>
                <!-- Blue rounded outer frame matching maletoilet.jpg -->
                <rect x='12' y='12' width='296' height='296' rx='42' fill='#ffffff' stroke='#1d4ed8' stroke-width='20'/>
                
                <!-- Blue Male Figure: Head, Torso, Arms, Legs -->
                <circle cx='160' cy='62' r='24' fill='#1d4ed8'/>
                <rect x='124' y='104' width='72' height='80' rx='12' fill='#1d4ed8'/>
                <rect x='132' y='178' width='22' height='56' rx='10' fill='#1d4ed8'/>
                <rect x='166' y='178' width='22' height='56' rx='10' fill='#1d4ed8'/>
                <path d='M 124 108 L 96 168 C 92 175, 80 170, 84 162 L 112 104 Z' fill='#1d4ed8'/>
                <path d='M 196 108 L 224 168 C 228 175, 240 170, 236 162 L 208 104 Z' fill='#1d4ed8'/>
                
                <!-- Blue text: MEN -->
                <text x='160' y='278' font-family="'Arial Black', Arial, sans-serif" font-weight='900' font-size='42' fill='#1d4ed8' text-anchor='middle' letter-spacing='1.5'>MEN</text>
            </svg>
        `);

        // Image configuration mapping primary filenames and precise fallbacks
        const IMAGES = {
            female: {
                primary: 'femaletoilet.jpg',
                fallback: SVG_FEMALE,
                label: '女廁標誌'
            },
            male: {
                primary: 'maletoilet.jpg',
                fallback: SVG_MALE,
                label: '男廁標誌'
            }
        };

        class SoundEngine {
            constructor() {
                this.synth = window.speechSynthesis;
                this.selectedVoice = null;
                this.initVoices();
            }

            initVoices() {
                if (!this.synth) return;
                const updateVoice = () => {
                    const voices = this.synth.getVoices();
                    // Prioritize Cantonese (zh-HK), then Mandarin (zh-TW/zh-CN), then general zh
                    this.selectedVoice = voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh_HK') ||
                                         voices.find(v => v.lang.startsWith('zh-TW')) ||
                                         voices.find(v => v.lang.startsWith('zh'));
                };

                updateVoice();
                if (this.synth.onvoiceschanged !== undefined) {
                    this.synth.onvoiceschanged = updateVoice;
                }
            }

            speak(text, onEndCallback) {
                if (!this.synth) {
                    if (onEndCallback) onEndCallback();
                    return;
                }

                this.synth.cancel(); // Stop any current speech

                const utterance = new SpeechSynthesisUtterance(text);
                if (this.selectedVoice) {
                    utterance.voice = this.selectedVoice;
                    utterance.lang = this.selectedVoice.lang;
                } else {
                    utterance.lang = 'zh-HK';
                }

                utterance.rate = 0.88; // Comfortable pace
                utterance.pitch = 1.0;

                let handled = false;
                const complete = () => {
                    if (!handled) {
                        handled = true;
                        if (onEndCallback) onEndCallback();
                    }
                };

                utterance.onend = complete;
                utterance.onerror = complete;

                this.synth.speak(utterance);
            }
        }

        class ToiletGame {
            constructor() {
                this.sound = new SoundEngine();
                this.currentRound = 0;
                this.maxRounds = 3;
                this.score = 0;
                this.isInputBlocked = false;
                this.currentQuestion = null;
            }

            start() {
                this.currentRound = 0;
                this.score = 0;

                document.getElementById('screen-start').classList.add('hidden');
                document.getElementById('screen-result').classList.add('hidden');
                document.getElementById('screen-game').classList.remove('hidden');
                document.getElementById('game-progress').classList.remove('hidden');

                this.nextRound();
            }

            nextRound() {
                if (this.currentRound >= this.maxRounds) {
                    this.showResults();
                    return;
                }

                this.currentRound++;
                this.isInputBlocked = false;

                // Update round counter UI
                document.getElementById('current-round-text').textContent = this.currentRound;

                // Target is ALWAYS male toilet sign ('male') for all 3 rounds
                const target = 'male';
                // Randomly assign left or right position for the male sign
                const isLeftTarget = Math.random() < 0.5;

                this.currentQuestion = {
                    target: target,
                    left: isLeftTarget ? 'male' : 'female',
                    right: !isLeftTarget ? 'male' : 'female'
                };

                // Display question text
                document.getElementById('question-text').textContent = `哪一個是「男廁標誌」？`;

                // Set image sources with automatic SVG fallback
                this.setupImage('img-left', this.currentQuestion.left);
                this.setupImage('img-right', this.currentQuestion.right);

                // Auto speak question
                this.speakCurrentQuestion();
            }

            setupImage(elementId, type) {
                const img = document.getElementById(elementId);
                const info = IMAGES[type];
                img.onerror = function() {
                    this.onerror = null;
                    this.src = info.fallback;
                };
                img.src = info.primary;
            }

            speakCurrentQuestion() {
                const promptText = `哪一個是男廁標誌？`;
                this.sound.speak(promptText);
            }

            replayQuestion() {
                if (this.currentQuestion && !this.isInputBlocked) {
                    this.speakCurrentQuestion();
                }
            }

            selectAnswer(chosenSide) {
                if (this.isInputBlocked) return;
                this.isInputBlocked = true;

                const chosenType = chosenSide === 'left' ? this.currentQuestion.left : this.currentQuestion.right;
                const isCorrect = chosenType === 'male';

                if (isCorrect) {
                    this.score++;
                    this.showFeedback(true, "你答對了!做得好!");
                } else {
                    this.showFeedback(false, "你答錯了!努力再試!");
                }
            }

            showFeedback(isCorrect, text) {
                const modal = document.getElementById('feedback-modal');
                const content = document.getElementById('feedback-content');
                const icon = document.getElementById('feedback-icon');
                const textElem = document.getElementById('feedback-text');

                if (isCorrect) {
                    content.className = "bg-slate-900 border-8 border-emerald-400 rounded-3xl p-8 md:p-12 text-center max-w-xl w-full shadow-2xl flex flex-col items-center animate-bounce-short";
                    icon.textContent = "✅";
                    textElem.textContent = text;
                    textElem.className = "text-3xl md:text-5xl font-black text-emerald-400 leading-tight";
                } else {
                    content.className = "bg-slate-900 border-8 border-rose-500 rounded-3xl p-8 md:p-12 text-center max-w-xl w-full shadow-2xl flex flex-col items-center";
                    icon.textContent = "❌";
                    textElem.textContent = text;
                    textElem.className = "text-3xl md:text-5xl font-black text-rose-500 leading-tight";
                }

                modal.classList.remove('hidden');

                // Speak voice feedback and progress
                this.sound.speak(text, () => {
                    setTimeout(() => {
                        modal.classList.add('hidden');
                        this.nextRound();
                    }, 500);
                });
            }

            showResults() {
                document.getElementById('screen-game').classList.add('hidden');
                document.getElementById('game-progress').classList.add('hidden');
                document.getElementById('screen-result').classList.remove('hidden');

                document.getElementById('final-score').textContent = this.score;

                const commentElem = document.getElementById('result-comment');
                const iconElem = document.getElementById('result-icon');
                let resultSpeech = "";

                if (this.score === 3) {
                    iconElem.textContent = "🌟🏆🌟";
                    commentElem.textContent = "太厲害了！完全答對！做得好！";
                    commentElem.className = "text-xl md:text-3xl text-yellow-300 font-black mt-2";
                    resultSpeech = "遊戲完成！太厲害了！你完全答對，做得好！";
                } else if (this.score >= 1) {
                    iconElem.textContent = "👍";
                    commentElem.textContent = "做得好！繼續努力會更棒喔！";
                    commentElem.className = "text-xl md:text-2xl text-emerald-400 font-bold mt-2";
                    resultSpeech = `遊戲完成！你答對了${this.score}題，做得好！`;
                } else {
                    iconElem.textContent = "💪";
                    commentElem.textContent = "努力再試，相信你一定可以的！";
                    commentElem.className = "text-xl md:text-2xl text-sky-400 font-bold mt-2";
                    resultSpeech = "遊戲完成！沒關係，努力再試，加油！";
                }

                this.sound.speak(resultSpeech);
            }
        }

        // Initialize instance on load
        let game;
        window.addEventListener('DOMContentLoaded', () => {
            game = new ToiletGame();
        });
    </script>
</body>
</html>
